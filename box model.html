<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        body
        {
            margin: 0;
            font-family: Arial;
        }
        .box1{
            width:300px;
            height: 150px;
            background-color: lightblue;
        }
        .box2{
            width: 250px;
            padding: 20px;
            background-color: lightgreen;
        }
        .box3{
            width: 250;
            margin:20px;
            background-color: lightpink;
        }
        .box4{
            width: 250px;
            padding: 20px;
            border: 3px solid black;
        }
        .box5{
            width:200px;
            height:100px;
            border: 2px solid green;
            border-radius: 15px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="box1">width and Height Example</div><br/>
    <div class="box2">Padding Example</div>
    <div class="box3">Margin Example</div>
    <div class="box4">Border Example</div><br/>
    <div class="box5">Border Radius Example</div>
</body>
</html>
