<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS typography</title>
    <style>
        body{
            font-family:Arial;
            background-color: lightpink;
        }
        h1{
            font-family: Arial;
            font-size: 40px;
            font-weight:700;
            color:Red;
            border:1px solid black;
        }
        h2{
            font-style: italic;
            text-transform: uppercase;
        }
        p{
            line-height: 1.6;
            letter-spacing: 1px;
        }
        .center-text
        {
            text-align: center;
            font-weight: bold;
        }
        a{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Welcome to CodeExpert Technology</h1>
    <h2>Learn web Development</h2>
    <p>Learn modern web development step by step.</p>
    <p class="center-text">Start your journey as a developer.</p>
    <a href="#">Visit our website</a>
</body>
</html>
